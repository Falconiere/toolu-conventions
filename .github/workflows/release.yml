# Cut a GitHub Release + tag + CHANGELOG.md on every push to main that
# carries releasable Conventional Commits (feat / fix / BREAKING).
#
# Docs-only, chore, and ci commits do not cut a release — semantic-release
# exits 0 with nothing published. The kit itself is not an npm package, so
# nothing is published to a registry.
#
# Pushes to main authenticate as the `all-app-release` GitHub App (secrets
# HOMEBREW_APP_ID / HOMEBREW_APP_PRIVATE_KEY — same publish App as
# Falconiere/git-better and Falconiere/comemory). The default GITHUB_TOKEN
# cannot push through the protect-main ruleset (require PR); the App can,
# once it is a bypass actor on that ruleset and installed on this repo with
# Contents: write.
#
# PRs dry-run with GITHUB_TOKEN (no push) and separately verify the App can
# mint a token so a missing install/secret fails before merge.
#
# semantic-release 25 requires Node ^22.14 || >=24.10 — Bun installs the
# toolchain, Node runs it (the version check reads process.version).
name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + GitHub Release + push CHANGELOG.md
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
    steps:
      # Same App + secret names as git-better/comemory release-plz. No
      # owner/repositories inputs → token is scoped to this repository.
      - name: Mint release token
        id: app-token
        if: github.event_name == 'push'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}

      # On PRs, prove the App is installed and the secrets resolve — without
      # using the token for the dry-run (dry-run never pushes).
      - name: Verify publish App token
        if: github.event_name == 'pull_request'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # App token on push so @semantic-release/git can push to main;
          # GITHUB_TOKEN is enough for PR dry-runs.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install release toolchain
        run: bun install --frozen-lockfile

      # Invoke via node + the local bin path — not bunx (semantic-release 25
      # reads process.version and rejects Bun's reported runtime).
      - name: Release (dry-run on PRs)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node node_modules/semantic-release/bin/semantic-release.js --dry-run

      - name: Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node node_modules/semantic-release/bin/semantic-release.js
