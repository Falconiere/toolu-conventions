# GitHub Actions — automated AI code review on every pull request.
#
# The fourth guard-rail layer, and the same workflow this kit ships to every
# stack. `RULES_GLOB` is the one thing tuned for this repo: the action
# auto-reads CLAUDE.md / AGENTS.md / CONTRIBUTING.md, none of which exist here —
# the house rules live in CORE.md, so it is added explicitly. Read from the BASE
# ref, so a PR cannot rewrite the rules it is judged against.
name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write # uploads the secret-scan / SAST SARIF to Code Scanning

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    # Draft PRs are skipped — mark ready for review to trigger the bot.
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the merge-base resolves

      - name: Review
        uses: falconiere/toolu-ghactions/code-review@v6
        with:
          PROVIDER: deepseek
          API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # CORE.md holds the house rules; guardrails/README.md and shared/README.md
          # hold the layout facts a reviewer needs to judge a path claim. Without
          # the latter two, a reviewer reading only CORE.md sees the destination
          # path scripts/guardrails/ and concludes the kit-side guardrails/ source
          # is stale — which it did, three review rounds running.
          RULES_GLOB: |
            CORE.md
            guardrails/README.md
            shared/README.md
          CODEBASE_OVERVIEW: >-
            This repo is an AI-agent-runnable conventions kit, not an
            application. The product is the instructions and the copy-ready
            templates under stacks/<stack>/templates/, which agents execute to
            scaffold new projects. There is almost no runtime code — the one
            file with real logic is
            stacks/console/templates/utilities/http.ts.

            LAYOUT — one module, two legitimate paths. The agent-guardrails
            source of truth is the repo-root guardrails/ directory (run.sh, lib/,
            checks/, oxlint-plugin/, patterns/, schema.json, __tests__/). A
            scaffold copies the manifest — run.sh lib checks patterns schema.json
            oxlint-plugin, never __tests__/ — into a generated project at
            scripts/guardrails/. So CORE.md, every stack SETUP.md, the
            .claude/settings.json hooks and every lefthook.yml name
            scripts/guardrails/, because they describe a generated project, while
            the kit itself only ever has guardrails/. Both paths are correct; one
            is source, the other destination. No stack carries its own copy of
            the module any more — the five byte-identical
            stacks/<stack>/templates/scripts/guardrails/ mirrors were deleted in
            v0.3, and validate-templates.sh now fails if one reappears. The
            shared/ directory holds the template files that are identical across
            stacks: shared/.claude/settings.json (all five) and
            shared/folder-README.md (console, marketing, backend-ts only — expo
            and rust ship their own, which genuinely differ).

            PATHS IN PROSE. Copy SOURCES in a stack SETUP.md are anchored to
            $KIT, the kit checkout, because the scaffolding agent's CWD is the
            new project directory it is building, not the kit — a source
            written relative to SETUP.md's own directory (../../guardrails/)
            would resolve outside the project instead. templates/... inside a
            stack SETUP.md means $KIT/stacks/<stack>/templates/.... Markdown
            READING links ([../../CORE.md](../../CORE.md)) are the one
            exception: they stay relative to the file's own directory and are
            correct, so do not flag them. scripts/validate-templates.sh now
            enforces both of the above, so a violation is a CI failure, not a
            review judgement call.

            YOU SEE A DIFF, NOT THE REPO. Do not claim a file or directory is
            missing, stale, fabricated, or renamed on the strength of its absence
            from the diff or from CORE.md's prose: unchanged files are simply not
            shown to you. Report a path only when the diff itself contains
            evidence it is wrong.

            A defect here is therefore: a template that contradicts its own
            stack's gate (its .oxlintrc.json, scripts/guardrails/run.sh, or
            package.json scripts); a SETUP.md step that would fail if followed
            literally; a config key that does not exist in the tool it
            configures; prose that claims behaviour the shipped config does not
            produce; or an internal reference to a template path or phase number
            that does not resolve.

            Two real examples from this branch's own review, for calibration: a
            stack shipped a vitest.config.ts that its own guardrails/run.sh
            rejects, and an unpinned `typescript` dependency resolved to a major
            version that made `astro check` refuse to run — both of which made a
            freshly scaffolded project red on its first gate run.

            Do not propose alternative library choices: the stack picks
            (Cloudflare Workers, Turso, better-auth, Zod, oRPC + TanStack Query,
            the kit's own http.ts over axios) are settled and recorded in
            CORE.md under "Platform defaults". Prose style, tone and the
            deliberate "be a little silly" house instructions are intentional
            and out of scope.
