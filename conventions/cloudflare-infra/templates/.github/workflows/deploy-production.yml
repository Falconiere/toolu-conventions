# Deploys a chosen ref to production. This is always a deliberate, manual step.
#
# Merging the release pull request (release.yml) tags vX.Y.Z. A tag does not
# deploy production by itself: run this workflow and pick the release tag in
# the "Use workflow from" menu (or `gh workflow run deploy-production.yml
# --ref vX.Y.Z`).
name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install optional secrets CLI
        run: |
          if [[ -x scripts/operations/infisical/install-cli.sh ]]; then
            scripts/operations/infisical/install-cli.sh
          fi
      - name: Deploy production
        env:
          INFISICAL_URL: ${{ secrets.INFISICAL_URL }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_MACHINE_IDENTITY_CLIENT_ID: ${{ secrets.INFISICAL_MACHINE_IDENTITY_CLIENT_ID }}
          INFISICAL_MACHINE_IDENTITY_CLIENT_SECRET: ${{ secrets.INFISICAL_MACHINE_IDENTITY_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/operations/cloudflare/deploy.sh --env production
