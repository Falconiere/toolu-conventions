name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: fmt · clippy · structure · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # scripts/guardrails/run.sh fails CLOSED (exit 3) when ast-grep is absent,
      # and the Rust stack is the one that still needs it: oxlint cannot parse
      # Rust, so the pattern rules have no other enforcer. jq is preinstalled on
      # the GitHub runners; ast-grep is not.
      - name: Install ast-grep
        run: cargo install ast-grep --locked

      - name: Structure
        run: bash scripts/guardrails/run.sh

      - name: Test
        run: cargo test
