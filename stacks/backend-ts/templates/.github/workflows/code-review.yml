# GitHub Actions — automated AI code review on every pull request.
#
# The third guard rail, after the agent's own `bun run check` and the CI job.
# It reads the repo's own convention files (CLAUDE.md and friends) from the BASE
# ref and reviews the diff against them, so the rules this kit installs are the
# rules the bot enforces — and a PR cannot rewrite the rules it is judged by.
#
# Setup (human-only): add an OPENROUTER_API_KEY repository secret.
# Inputs and defaults: https://github.com/falconiere/toolu-ghactions
name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write # uploads the secret-scan / SAST SARIF to Code Scanning

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    # Draft PRs are skipped — mark ready for review to trigger the bot.
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the merge-base resolves

      - name: Review
        uses: falconiere/toolu-ghactions/code-review@v6
        with:
          API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Generated by `wrangler types`; not ours to review.
          EXCLUDE_GLOBS: 'worker-configuration.d.ts'
          CODEBASE_OVERVIEW: >-
            Hono service on Cloudflare Workers (workerd), Turso over HTTP for
            persistence. Routes are thin and live in src/routes; logic lives in
            src/services. Config arrives as Worker bindings, never process.env,
            and secrets never appear in wrangler.jsonc. Tests run inside the
            real runtime against a real database — a mock-only test is a defect.
