# Bun runtime + test configuration. `bun test` (the built-in runner) reads the
# [test] block below. Docs: https://bun.sh/docs/runtime/bunfig

[test]
# Coverage is opt-in — run `bun test --coverage` when you want a report, or flip
# this to true to make it the default.
coverage = false

# Global test setup, if you add one. Preload runs before every test file — use it
# for shared fixtures, not for mocks (see CORE: real-data tests only).
# preload = ["./src/test-setup.ts"]
