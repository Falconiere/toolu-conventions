# Pre-commit hooks. Install once with: bunx lefthook install
# Runs only on staged files, in parallel. Keep it fast — heavier checks
# (type-check, full test) belong in CI / `bun run check`.
pre-commit:
  parallel: true
  commands:
    fmt:
      glob: '*.{ts,tsx,json,md,yaml,yml,css}'
      run: bunx oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    lint:
      glob: 'src/**/*.{ts,tsx}'
      run: bunx oxlint --deny-warnings {staged_files}
