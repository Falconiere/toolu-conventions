# GitHub Actions — code-quality gate for every PR (and pushes to main).
# Mirrors `bun run check`: type-check + lint + format-check + test.
#
# Copy to `.github/workflows/ci.yml`. Keep the Bun version in sync with the
# `bun` line in your local toolchain and the README badge if you add one.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: type-check · lint · format · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      - name: Structure check
        run: bun run check:structure

      - name: Test
        run: bun run test
